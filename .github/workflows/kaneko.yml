name: 金子コーチ（空室・事業計画）

on:
  push:
    paths:
      - "properties/*/property.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: 空室リスク・事業計画分析
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 金子コーチ起動
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO:          ${{ secrets.NOTIFY_TO }}
        run: python agents/kaneko.py

      - name: ダッシュボード更新
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO:          ${{ secrets.NOTIFY_TO }}
        run: python update_dashboard.py

      - name: レポート＆ダッシュボードをコミット＆プッシュ
        run: |
          git config user.email "bot@naturaf.jp"
          git config user.name  "NATURAF Bot"
          git add properties/ index.html
          git diff --staged --quiet || git commit -m "[金子] 空室・事業計画レポート＋ダッシュボード更新"
          git push
