name: 高橋代表（最終判断）

on:
  push:
    paths:
      - "properties/*/aoyagi-report.json"
      - "properties/*/kaneko-report.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  judge:
    name: 最終スコアリング・判断
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 高橋代表起動
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO:          ${{ secrets.NOTIFY_TO }}
        run: python agents/takahashi.py

      - name: ダッシュボード更新
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO:          ${{ secrets.NOTIFY_TO }}
        run: python update_dashboard.py

      - name: レポート＆ダッシュボードをコミット＆プッシュ
        run: |
          git config user.email "bot@naturaf.jp"
          git config user.name  "NATURAF Bot"
          git add properties/ index.html
          git diff --staged --quiet || git commit -m "[高橋] 最終判断レポート＋ダッシュボード更新"
          git push
